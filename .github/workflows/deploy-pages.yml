name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Last audited Korean release before the upstream v1.2-patch-8 sync.
  LOCALIZATION_AUDIT_BASE: b23a2b07ea79764bcdb739ca453fff22ba2f4397

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check all changes since the audited localization baseline
        run: npm run check:ko -- --base=$LOCALIZATION_AUDIT_BASE

      - name: Check localization structure since the audited baseline
        run: npm run check:ko:structure -- --base=$LOCALIZATION_AUDIT_BASE

      - name: Run localization regression tests
        run: npm run test:localization:ko

      - name: Check release safety
        run: npm run test:release-safety

      - name: Build release
        run: npm run build:release

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
